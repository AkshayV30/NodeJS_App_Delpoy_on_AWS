
name: Build and deploy to Amazon ECS

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# Serialize runs for the same ref; do not cancel an active deployment.
concurrency:
  group: node-ecs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install and test
        uses: ./.github/actions/test-node

  deploy:
    name: Publish image and deploy
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    # Serialize production deployments across branches and runs.
    concurrency:
      group: node-ecs-production
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ secrets.ECS_CONTAINER_NAME }}

    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configure AWS
        uses: ./.github/actions/configure-aws
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          aws-role-arn: ${{ env.AWS_ROLE_ARN }}

      - name: Build and publish image
        id: image
        uses: ./.github/actions/publish-ecr-image
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-account-id: ${{ env.AWS_ACCOUNT_ID }}
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy to ECS
        uses: ./.github/actions/deploy-ecs
        with:
          ecs-cluster: ${{ env.ECS_CLUSTER }}
          ecs-service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image-uri: ${{ steps.image.outputs.image-uri }}
