
name: Deploy application to ECS
description: Register an updated task definition and deploy it to ECS

inputs:
  ecs-cluster:
    description: ECS cluster name or ARN
    required: true
  ecs-service:
    description: ECS service name or ARN
    required: true
  task-definition:
    description: Task definition family or ARN
    required: true
  container-name:
    description: Container name in the task definition
    required: true
  image-uri:
    description: Published ECR image URI
    required: true

runs:
  using: composite
  steps:
    - name: Register task definition
      id: task-definition
      shell: bash
      env:
        ECS_TASK_DEFINITION: ${{ inputs.task-definition }}
        ECS_CONTAINER_NAME: ${{ inputs.container-name }}
        IMAGE_URI: ${{ inputs.image-uri }}
      run: |
        set -euo pipefail

        source_definition="$RUNNER_TEMP/task-definition-source.json"
        deploy_definition="$RUNNER_TEMP/task-definition-deploy.json"
        registration="$RUNNER_TEMP/task-definition-registration.json"

        aws ecs describe-task-definition \
          --task-definition "$ECS_TASK_DEFINITION" \
          --query taskDefinition \
          --output json > "$source_definition"

        jq --arg name "$ECS_CONTAINER_NAME" \
           --arg image "$IMAGE_URI" '
          ([.containerDefinitions[] | select(.name == $name)] | length)
          as $matches
          | if $matches != 1 then
              error("Expected exactly one matching container")
            else
              .containerDefinitions |= map(
                if .name == $name then .image = $image else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt
                )
            end
        ' "$source_definition" > "$deploy_definition"

        aws ecs register-task-definition \
          --cli-input-json "file://$deploy_definition" \
          > "$registration"

        task_definition_arn="$(
          jq -er '.taskDefinition.taskDefinitionArn' "$registration"
        )"

        echo "arn=$task_definition_arn" >> "$GITHUB_OUTPUT"

    - name: Update ECS service
      shell: bash
      env:
        ECS_CLUSTER: ${{ inputs.ecs-cluster }}
        ECS_SERVICE: ${{ inputs.ecs-service }}
        TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.arn }}
      run: |
        set -euo pipefail

        aws ecs update-service \
          --cluster "$ECS_CLUSTER" \
          --service "$ECS_SERVICE" \
          --task-definition "$TASK_DEFINITION_ARN"

    - name: Wait for service stability
      shell: bash
      env:
        ECS_CLUSTER: ${{ inputs.ecs-cluster }}
        ECS_SERVICE: ${{ inputs.ecs-service }}
      run: |
        set -euo pipefail

        aws ecs wait services-stable \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE"

    - name: Report deployed task definition
      shell: bash
      env:
        ECS_CLUSTER: ${{ inputs.ecs-cluster }}
        ECS_SERVICE: ${{ inputs.ecs-service }}
      run: |
        set -euo pipefail

        aws ecs describe-services \
          --cluster "$ECS_CLUSTER" \
          --services "$ECS_SERVICE" \
          --query 'services[0].taskDefinition' \
          --output text
